<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Story Bible — protected</title>
<!-- Icons repeated here because StatiCrypt replaces the whole document: before
     decryption this template IS the page, so without these the gate would show
     a blank favicon and install with no home-screen icon. Paths are relative —
     the site is served from a sub-path. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Meridian">
<!--
  StatiCrypt password prompt, restyled to the Meridian Resonance design system
  (Style Guide Part II): black ground, Space Grotesk headings, Inter body, and
  the dual spot colours — Terra Azure #087DC2 and Ares Rose #D93D4A.
  Unified to one hex each: a single value that reads on both
  black and white (4.45:1 on each, the ceiling for one colour on both).
  This template is standalone — it is NOT built from SHARED_CSS — so the
  palette has to be kept in step with build_site.py by hand.

  Every id and class StatiCrypt's engine touches is preserved:
    #staticrypt_loading  #staticrypt_content  #staticrypt-form
    #staticrypt-password  #staticrypt-remember  #staticrypt-remember-label
    .staticrypt-toggle-password-visibility
  and the name placeholders it fills at encrypt time. Restyle freely,
  but do not rename or remove those hooks or decryption breaks.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{
  --black:#0A0A0A; --white:#FFFFFF; --muted:#FFFFFF; --grey:#777777;
  --hairline:rgba(255,255,255,0.12);
  --earth:#087DC2; --mars:#D93D4A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--black); color:var(--white);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:24px; min-height:100vh;
}
/* Faint azure-to-rose wash so the gate reads as part of the site, not a stop sign. */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(60vw 60vw at 18% 12%, rgba(88,198,255,0.10), transparent 60%),
    radial-gradient(55vw 55vw at 82% 88%, rgba(255,122,100,0.10), transparent 60%);
}
.hidden{display:none !important;}

/* Sparkles are SMIL (<animateMotion> along the mark's own path), not CSS, so
   reduced-motion is honoured by hiding them rather than pausing them. */
.mr-spark{mix-blend-mode:screen;}
@media (prefers-reduced-motion:reduce){.mr-spark{display:none}}

/* loading spinner */
.staticrypt-spinner-container{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
}
.staticrypt-spinner{
  width:34px; height:34px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.14); border-top-color:var(--earth);
  animation:mrspin .8s linear infinite;
}
@keyframes mrspin{to{transform:rotate(360deg);}}

.staticrypt-page{position:relative; width:100%; max-width:440px;}

.mr-logo{
  display:block; margin:0 auto 28px; width:250px; height:auto;
}
.staticrypt-instructions{text-align:center; margin-bottom:26px;}
.staticrypt-title{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(23px,4.4vw,30px); line-height:1.2; letter-spacing:-0.02em;
  margin:0 0 12px;
  background:linear-gradient(90deg,var(--earth),var(--mars));
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:var(--earth);
}
.staticrypt-instructions p:not(.staticrypt-title){
  margin:0; color:var(--muted); font-size:13.5px; line-height:1.65;
}
.staticrypt-hr{
  border:none; border-top:1px solid var(--hairline); margin:0 0 24px;
}

.staticrypt-password-container{position:relative; margin-bottom:16px;}
.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"]{
  width:100%; background:rgba(255,255,255,0.06);
  border:1px solid var(--hairline); border-radius:10px;
  color:var(--white); padding:14px 46px 14px 16px;
  font-family:'Inter',sans-serif; font-size:15px; text-align:center;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.staticrypt-form input[type="password"]::placeholder,
.staticrypt-form input[type="text"]::placeholder{color:var(--grey);}
.staticrypt-form input[type="password"]:focus,
.staticrypt-form input[type="text"]:focus{
  outline:none; border-color:var(--earth);
  box-shadow:0 0 0 3px rgba(88,198,255,0.16);
}
.staticrypt-toggle-password-visibility{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  width:19px; height:19px; cursor:pointer; opacity:.5;
  filter:invert(1); transition:opacity .2s ease;
}
.staticrypt-toggle-password-visibility:hover{opacity:.85;}

.staticrypt-remember{
  display:flex; align-items:center; justify-content:center; gap:9px;
  color:var(--muted); font-size:13px; margin-bottom:20px; cursor:pointer;
  user-select:none;
}
.staticrypt-remember input[type="checkbox"]{
  accent-color:var(--mars); width:15px; height:15px; cursor:pointer;
}

.staticrypt-decrypt-button{
  width:100%; background:var(--mars); color:var(--black);
  border:none; padding:14px 26px; border-radius:100px;
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:14.5px; letter-spacing:0.03em; cursor:pointer;
  transition:transform .15s ease, filter .2s ease;
}
.staticrypt-decrypt-button:hover{filter:brightness(1.08); transform:translateY(-1px);}
.staticrypt-decrypt-button:active{transform:translateY(0);}

.mr-footnote{
  margin:24px 0 0; text-align:center; color:var(--white);
  font-size:11.5px; line-height:1.6; letter-spacing:0.01em;
}
@media (max-width:420px){
  .mr-logo{width:200px; margin-bottom:22px;}
}
</style>

      isRememberChecked = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
